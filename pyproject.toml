[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoying-agents"
version = "0.1.0"
description = "Four auditable content agents with bounded model/tool loops"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
xiaoying = "xiaoying_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
