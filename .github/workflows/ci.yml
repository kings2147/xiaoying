name: offline-validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit and boundary tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reproduce offline acceptance scenarios
        run: |
          python scripts/evaluate.py media --provider mock
          python scripts/evaluate.py planning --provider mock
          python scripts/evaluate.py knowledge --provider mock
          python scripts/evaluate.py script --provider mock
      - name: Audit committed model traces against actual tools
        run: python scripts/audit_evidence.py
